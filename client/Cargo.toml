[package]
name = "deepdolphin-client"
version = "0.1.0"
edition = "2021"
description = "deepDolphin — moonGit 引擎的跨平台桌面客户端（macOS / Windows / Linux），BUI 驱动"
license = "GPL-3.0-or-later"

[dependencies]
# Blender 的 GPU/CPU UI 工具包（解耦版）：HTML + CSS 直接画进原生窗口。
# 跨平台原生宿主：Win32 / Cocoa / X11。许可证 GPL-3.0-or-later。
blenderui = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
