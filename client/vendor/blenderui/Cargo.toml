[package]
edition = "2024"
rust-version = "1.88"
name = "blenderui"
version = "0.5.0"
authors = ["BUI contributors"]
build = false
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "README.md",
    "Cargo.toml",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Blender's UI for Rust: gpui-style syntax, every HTML element and CSS, drawn by the BUI C kit"
homepage = "https://bui.preetham.top"
documentation = "https://docs.rs/blenderui"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "blender",
    "gpui",
    "html",
]
categories = ["gui"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ppmpreetham/BUI"
resolver = "2"

[features]
bmp = ["blenderui-sys/bmp"]
default = [
    "slug",
    "png",
    "gif",
    "bmp",
    "tga",
    "qoi",
    "jpeg",
    "webp",
    "hdr",
    "pnm",
    "svg",
    "video",
    "gpu",
    "freetype",
    "filebrowser",
]
filebrowser = ["blenderui-sys/filebrowser"]
